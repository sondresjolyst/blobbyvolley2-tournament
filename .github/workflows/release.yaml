name: Release

on:
  push:
    branches:
      - main
  # A manual run is a dry run. It builds the image and the packages
  # but pushes and uploads nothing.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@dae4f55b517888e44a342a5f7d3dfac40580a127 # v9.44.0
    permissions:
      contents: write
      pull-requests: write

  get-version:
    name: Get release version
    needs: release-please
    if: always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Read the tag release-please created
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAMES: ${{ needs.release-please.outputs.path_tag_names }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            {
              echo "tag="
              echo "version=dry-run"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(echo "$TAG_NAMES" | jq -r '.["."] // empty')
          # Release-please leaves the root package out of path_tag_names, so read the version it released.
          if [ -z "$tag" ]; then
            tag="v$(jq -r '.["."]' .release-please-manifest.json)"
          fi
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected release tag '$tag'"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  docker:
    name: Server image
    needs: get-version
    if: always() && needs.get-version.result == 'success'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/docker.yaml
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      tag: ${{ needs.get-version.outputs.tag }}
      tag_latest: true
      push: ${{ needs.get-version.outputs.publish == 'true' }}

  # Opens a pull request in tumogroup-charts that sets the blobby-server chart to the new image.
  update-chart:
    name: Update chart
    needs: [get-version, docker]
    if: ${{ needs.get-version.outputs.publish == 'true' && needs.docker.result == 'success' }}
    permissions:
      contents: read
    uses: sondresjolyst/tumogroup-charts/.github/workflows/update-chart.yml@e96af8bd95ed381f66a3fd0732c558424337a865 # main
    secrets:
      CHARTS_PAT: ${{ secrets.CHARTS_PAT }}
    with:
      chart_name: blobby-server
      tag: ${{ needs.get-version.outputs.tag }}

  packages:
    name: Packages
    needs: get-version
    if: always() && needs.get-version.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/package.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}
      release_tag: ${{ needs.get-version.outputs.tag }}

  # Runs when a platform failed too, so the manifest lists the packages that did attach.
  # After "Re-run failed jobs" these jobs run again and sign the manifest with the new packages.
  sign-update-manifest:
    name: Sign update manifest
    needs: [get-version, packages]
    if: ${{ !cancelled() && needs.get-version.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Only this job can read the signing key. It has no write access.
    environment: update-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/update-keys
      # The packages this run built. The script signs their hashes, not whatever is on the release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blobbyvolley2-tournament-${{ needs.get-version.outputs.version }}-*
          path: packages
          merge-multiple: true
      - name: Write and sign latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.get-version.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: sh .github/scripts/make-update-manifest.sh "$REPO" "$TAG" manifest packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-manifest
          path: |
            manifest/latest.json
            manifest/latest.json.sig
            manifest/keys.json
            manifest/keys.json.sig
          if-no-files-found: error
          overwrite: true

  upload-update-manifest:
    name: Upload update manifest
    needs: [get-version, sign-update-manifest]
    if: ${{ !cancelled() && needs.sign-update-manifest.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-manifest
          path: manifest
      - name: Upload the manifest and the keys file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.get-version.outputs.tag }}
        run: gh release upload "$TAG" manifest/latest.json manifest/latest.json.sig manifest/keys.json manifest/keys.json.sig --repo "$REPO" --clobber
