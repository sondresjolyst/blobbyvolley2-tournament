name: Docker

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  workflow_call:
    inputs:
      tag:
        description: "Image tag for a release, such as v0.1.0"
        type: string
        required: true
      tag_latest:
        description: "Also push the latest tag"
        type: boolean
        required: false
        default: false
      push:
        description: "Push the image. When false the image is only built."
        type: boolean
        required: false
        default: true
    secrets:
      DOCKER_PASSWORD:
        required: true

# github.workflow is the caller's name in a called run, so the prefix keeps
# this group apart from the caller's group.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build image
    if: github.event_name == 'pull_request' || (inputs.tag != '' && !inputs.push)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false

  tag:
    name: Pick image tag
    if: github.event_name != 'pull_request' && (inputs.tag == '' || inputs.push)
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      environment: ${{ steps.pick.outputs.environment }}
      latest: ${{ steps.pick.outputs.latest }}
    steps:
      - name: Pick tag and environment
        id: pick
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "latest=$TAG_LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  push:
    name: Push image
    needs: tag
    permissions:
      contents: read
      packages: read
    uses: equinor/ops-actions/.github/workflows/docker.yml@dae4f55b517888e44a342a5f7d3dfac40580a127 # v9.44.0
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      environment: ${{ needs.tag.outputs.environment }}
      registry: registry.hub.docker.com
      username: sondresjo
      repository: sondresjo/blobby-server
      tag: ${{ needs.tag.outputs.tag }}
      tag_latest: ${{ needs.tag.outputs.latest == 'true' }}
      build_args: ${{ format('{{"BLOBBY_VERSION":"{0}"}}', needs.tag.outputs.tag) }}
